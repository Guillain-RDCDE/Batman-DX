<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Batman DX — lab</title>
<style>
:root{--gold:#ffd21a;--bg:#0e0e14;--cardbg:#1b1b25;--border:#3a3a4a;--txt:#e8e8f0;--softc:#a9a9bb}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font:16px/1.45 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;margin:0;padding:14px;max-width:1080px;margin:auto}
h1{color:var(--gold);font-size:26px;margin:6px 0 2px} h2{color:var(--gold);font-size:18px;margin:0 0 8px}
p{margin:6px 0} .soft{color:var(--softc);font-size:14px} a{color:var(--gold)}
.card{background:var(--cardbg);border:1px solid var(--border);border-radius:12px;padding:14px;margin:12px 0}
button,select,.filebtn{font:inherit;font-size:15px;padding:9px 13px;border-radius:9px;border:1px solid var(--border);background:#2a2a36;color:var(--txt);margin:3px;cursor:pointer}
button.go{background:var(--gold);color:#000;font-weight:700;border-color:var(--gold)}
button:disabled{opacity:.4;cursor:default}
#dropzone{border:2px dashed var(--border);border-radius:12px;padding:22px;text-align:center}
#dropzone.over{border-color:var(--gold);background:#24242f}
#status{font-weight:600} .ok{color:#7be08a} .ko{color:#ff7b7b}
.game{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;justify-content:center}
canvas#lcd{image-rendering:pixelated;width:min(92vw,480px);aspect-ratio:160/144;background:#000;border:3px solid #333;border-radius:8px}
.gamepad{user-select:none;-webkit-user-select:none;touch-action:manipulation;text-align:center}
.pad{display:inline-grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);vertical-align:middle;margin:6px 16px}
.k{background:#2a2a36;border:1px solid #555;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:17px}
.k.on{background:var(--gold);color:#000}
.ab{display:inline-block;vertical-align:middle;margin:6px 16px} .ab .k{display:inline-flex;width:62px;height:62px;border-radius:50%;margin:4px}
.mid .k{display:inline-flex;padding:8px 14px;margin:4px;font-size:13px}
#pals{display:flex;flex-wrap:wrap;gap:8px}
.pal{background:#22222c;border:1px solid var(--border);border-radius:9px;padding:6px}
.pal b{display:block;font-size:12px;color:var(--softc);margin-bottom:4px}
.pal input{width:38px;height:38px;padding:0;border:1px solid #000;background:none;cursor:pointer}
.lang{float:right}
.scroller{overflow:auto;border:1px solid var(--border);border-radius:8px;margin:8px 0;background:#000;-webkit-overflow-scrolling:touch}
#preview{image-rendering:pixelated;display:block;cursor:crosshair}
#zoom,#result{image-rendering:pixelated;border:1px solid #555;margin:3px;cursor:pointer}
.cols{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;background:#22222c;border:1px solid var(--border);border-radius:9px;padding:10px}
</style>
</head>
<body>
<div class="lang"><button id="bfr">FR</button><button id="ben">EN</button></div>
<h1>Batman DX</h1>
<p class="soft" data-t="tagline"></p>

<div class="card">
  <h2 data-t="t1"></h2>
  <div id="dropzone">
    <p data-t="drop"></p>
    <label class="filebtn"><span data-t="choose"></span><input type="file" id="f" accept=".gb,.gbc,.bin" hidden></label>
    <p id="status" class="soft" data-t="waiting"></p>
  </div>
  <p class="soft" data-t="privacy"></p>
</div>

<div class="card" id="c2" hidden>
  <h2 data-t="t2"></h2>
  <select id="mood"></select>
  <button class="go" id="dlrom" data-t="dlrom"></button>
  <button id="dlips" data-t="dlips"></button>
  <p class="soft" id="sha"></p>
</div>

<div class="card" id="c3" hidden>
  <h2 data-t="t3"></h2>
  <div class="game">
    <canvas id="lcd" width="160" height="144"></canvas>
    <div class="gamepad">
      <div><div class="pad">
        <span></span><div class="k" data-k="UP">▲</div><span></span>
        <div class="k" data-k="LEFT">◀</div><span></span><div class="k" data-k="RIGHT">▶</div>
        <span></span><div class="k" data-k="DOWN">▼</div><span></span></div>
        <div class="ab"><div class="k" data-k="B">B</div><div class="k" data-k="A">A</div></div></div>
      <div class="mid"><div class="k" data-k="SELECT">SELECT</div><div class="k" data-k="START">START</div></div>
      <p class="soft" data-t="keyshelp"></p>
      <button id="restart" data-t="restart"></button>
    </div>
  </div>
</div>

<div class="card" id="c4" hidden>
  <h2 data-t="t4"></h2>
  <p class="soft" data-t="labhelp"></p>
  <select id="scene"></select>
  <select id="what"><option value="bg" data-t="bgopt"></option><option value="obj" data-t="charopt"></option></select>
  <div id="pals" style="margin:10px 0"></div>
  <div id="view" hidden>
    <select id="stagesel"></select> <span class="soft" data-t="taphint"></span>
    <div class="scroller"><canvas id="preview"></canvas></div>
    <div id="toolbox" hidden>
      <div class="cols">
        <div>
          <b id="tiletitle"></b>
          <p><span data-t="tilepallbl"></span> <select id="tilepal"></select></p>
          <p><button id="bgpal" data-t="bgpal"></button></p>
          <p class="soft" data-t="edgehelp"></p>
          <p><button id="detect" data-t="detect"></button>
             <select id="inside"><option value="0" data-t="m0"></option><option value="1" data-t="m1"></option><option value="2" data-t="m2"></option></select></p>
          <p><button class="go" id="apply" data-t="apply"></button> <button id="remove" data-t="remove"></button></p>
          <p id="room" class="soft"></p>
        </div>
        <div><canvas id="zoom" width="192" height="192"></canvas><br><canvas id="result" width="192" height="192"></canvas></div>
      </div>
    </div>
  </div>
  <p style="margin-top:10px">
  <button class="go" id="tryit" data-t="tryit"></button>
  <button id="exportbtn" data-t="exportbtn"></button>
  <label class="filebtn"><span data-t="importlbl"></span><input type="file" id="importfile" accept=".json" hidden></label>
  <button id="reset" data-t="reset"></button></p>
  <p id="warn" class="ko"></p>
</div>

<p class="soft" data-t="footer"></p>

<script src="wasmboy.wasm.iife.js"></script>
<script>
"use strict";
// ---------------------------------------------------------------- interface texts (French / English)
const T={fr:{

 detect:"Détecter le fond", m0:"le reflet rejoint la teinte suivante", m1:"tout descend d'un cran", m2:"reflet et corps descendent, contour gardé",
 apply:"Appliquer la retouche", remove:"Retirer la retouche", tile:"Tuile ", retouched:" (retouchée)", full:"Plus de place dans la cartouche pour d'autres retouches : retirez-en une.",
 free:"Place libre pour les retouches : ", bytes:" octets", level:"Étape ", screen:"Écran",
 labhelp:"Choisissez un lieu et changez ses couleurs. Dans les niveaux et les scènes, touchez un élément pour choisir sa palette ou lui donner des bords transparents. Puis « Essayer mes réglages ». Le téléchargement ci-dessus reprend vos réglages.",
 tryit:"Essayer mes réglages", exportbtn:"Exporter mes réglages (.json)", importlbl:"Importer des réglages",
 mood:{dx:"Batman DX (l'édition publiée)",movie:"Film 1989",comic:"Bande dessinée",pastel:"Pastel",night:"Gotham la nuit",green:"Game Boy vert"},
 sc:["Écrans de texte, Game Over","Logo et écran-titre","Gotham City (1-1, 2-1)","Usine chimique (1-2, 1-3)","Batman contre Jack (1-B)","Musée Flugelheim (2-2, 2-3)","Batwing, coucher de soleil (3-1)","Batwing, nuit (3-2)","Cathédrale (4-1, 4-2)","Batman contre le Joker (4-B)","Scène : la police","Scène : le Joker","Scène : le Joker à l'écran","Scène : la fin","Scène : la Batmobile","Générique de fin"],

},en:{
 tagline:"The 1990 Game Boy Batman, colorized. Drop your ROM, leave with the game in color.",
 t1:"1. Your original ROM", drop:"Drop your “Batman - The Video Game (World).gb” file here, or:", choose:"Choose file",
 waiting:"No file yet.", privacy:"Nothing is uploaded: everything happens in your browser. The ROM is not provided.",

 checksum:"SHA-1 of the produced game: ", statusbar:"status bar", pal:"Palette ", running:"running", loading:"loading…",
 taphint:"Tap any piece of scenery to adjust it.", tilepallbl:"Palette of this tile:", bgpal:"Give this palette the background color (lightest shade)",
 edgehelp:"Transparent edges: the original drawing is on top. Dots circled in gold are “background”; tap a light dot to toggle it. The result is below.",
 detect:"Detect the background", m0:"the highlight joins the next shade", m1:"everything moves down one shade", m2:"highlight and body move down, outline kept",
 apply:"Apply the retouch", remove:"Remove the retouch", tile:"Tile ", retouched:" (retouched)", full:"No room left in the cartridge for more retouches: remove one.",
 free:"Free room for retouches: ", bytes:" bytes", level:"Stage ", screen:"Screen",
 labhelp:"Pick a place and change its colors. In levels and scenes, tap a piece of scenery to choose its palette or give it transparent edges. Then “Try my settings”. The download above uses your settings.",
 tryit:"Try my settings", exportbtn:"Export my settings (.json)", importlbl:"Import settings",
 mood:{dx:"Batman DX (the published edition)",movie:"1989 movie",comic:"Comic book",pastel:"Pastel",night:"Gotham by night",green:"Game Boy green"},
 sc:["Text screens, Game Over","Logo and title screen","Gotham City (1-1, 2-1)","Chemical plant (1-2, 1-3)","Batman vs Jack (1-B)","Flugelheim Museum (2-2, 2-3)","Batwing, sunset (3-1)","Batwing, night (3-2)","Cathedral (4-1, 4-2)","Batman vs the Joker (4-B)","Scene: the police","Scene: the Joker","Scene: the Joker on screen","Scene: the ending","Scene: the Batmobile","End credits"],
 ob:["Batman","Shots, items","Enemies A","Enemies B","Enemies C","Flash (boss)","Flash","Flash"]
}};
let L=(navigator.language||'en').startsWith('fr')?'fr':'en';
const $=id=>document.getElementById(id), t=k=>T[L][k];
function applyTexts(){document.documentElement.lang=L;document.querySelectorAll('[data-t]').forEach(e=>{if(e.id!=='status'||!e.dataset.frozen)e.textContent=t(e.dataset.t)});
  const a=$('mood'),v=a.value;a.innerHTML='';for(const k of Object.keys(T.fr.mood)){const o=document.createElement('option');o.value=k;o.textContent=t('mood')[k];a.appendChild(o)}a.value=v||'dx';
  const s=$('scene'),sv=s.value;s.innerHTML='';t('sc').forEach((n,i)=>{const o=document.createElement('option');o.value=i;o.textContent=n;s.appendChild(o)});s.value=sv||'2';
  if(M)renderPalettes()}
$('bfr').onclick=()=>{L='fr';applyTexts()};$('ben').onclick=()=>{L='en';applyTexts()};

// ---------------------------------------------------------------- patch constants
const SHA_ORIG='ef7d6684a0f737c01a1f2cc2c6609e0f3ac1310e', SIZE=131072;
const SCENE_TABLE=0x18D47, NB_SCENES=16, BANK6=0x18000;
const ZONES=[[0x18D67,0x1A800],[0x1B636,0x1C000]];

const VIEWS={2:{a:[0,1,0x1B,6,7,0x12],stagesel:[1,5]},3:{a:[0,1,0x1C,4,5,0x12],stagesel:[2,3]},4:{a:[0,1,0x12,0x0E,0x0F,0x13],stagesel:[4]},
 5:{a:[0,1,0x1D,8,9,0x12],stagesel:[6,7]},6:{a:[0,0x0C,0x0D,0x12,0x16,0x17,0x18],stagesel:[8]},7:{a:[0,0x0C,0x0D,0x12,0x16,0x19,0x1A],stagesel:[9]},
 8:{a:[0,1,0x1E,0x0A,0x0B,0x12],stagesel:[0x0B]},9:{a:[0,1,0x12,0x10,0x11,0x14,0x15],stagesel:[0x0C]},
 10:{a:[0],b:[0,1,2,3]},11:{a:[0],b:[4,5,6,7]},12:{a:[0],b:[8,9,10,11]},13:{a:[0],b:[12,13,14,15]},14:{a:[0],b:[16,17,18,19,20]}};
const STAGENAME={1:'1-1',2:'1-2',3:'1-3',4:'1-B',5:'2-1',6:'2-2',7:'2-3',8:'3-1',9:'3-2',0x0B:'4-1/4-2',0x0C:'4-B'};
const INSIDE=[[1,1,2,3],[1,2,3,3],[1,2,2,3]];
let orig=null, base=null, rom=null, M=null;

async function sha1(u8){const h=await crypto.subtle.digest('SHA-1',u8);return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}
function applyIPS(src,ips){
  const d=new Uint8Array(src); if(String.fromCharCode(...ips.slice(0,5))!=='PATCH')throw new Error('IPS');
  let p=5;
  while(p+3<=ips.length){ if(ips[p]===0x45&&ips[p+1]===0x4F&&ips[p+2]===0x46&&p+3===ips.length)return d;
    const o=(ips[p]<<16)|(ips[p+1]<<8)|ips[p+2], n=(ips[p+3]<<8)|ips[p+4]; p+=5;
    if(n){d.set(ips.slice(p,p+n),o);p+=n}else{const r=(ips[p]<<8)|ips[p+1];d.fill(ips[p+2],o,o+r);p+=3}}
  throw new Error('IPS without end')}
function makeIPS(a,b){
  const out=[0x50,0x41,0x54,0x43,0x48]; let i=0; const n=a.length;
  while(i<n){ if(a[i]===b[i]){i++;continue}
    let j=i,last=i; while(j<n&&j-i<0xFFFF){ if(a[j]!==b[j])last=j; else if(j-last>8)break; j++ }
    const seg=b.slice(i,last+1); out.push(i>>16,(i>>8)&255,i&255,seg.length>>8,seg.length&255,...seg); i=last+1}
  out.push(0x45,0x4F,0x46); return new Uint8Array(out)}
function fixChecksum(d){
  let s=0; for(let i=0;i<d.length;i++) if(i!==0x14E&&i!==0x14F) s=(s+d[i])&0xFFFF; d[0x14E]=s>>8; d[0x14F]=s&255}
const hex=c=>'#'+c.map(v=>Math.round(v*255/31).toString(16).padStart(2,'0')).join('');
const unhex=h=>[1,3,5].map(i=>Math.round(parseInt(h.substr(i,2),16)*31/255));
function same(a,b){for(let i=0;i<a.length;i++)if(a[i]!==b[i])return false;return true}

// ---------------------------------------------------------------- the model: the 16 scenes read from the patched ROM
function readModel(d){ const sc=[];
  for(let i=0;i<NB_SCENES;i++){ const p=SCENE_TABLE+2*i; let o=BANK6+((d[p]|(d[p+1]<<8))-0x4000);
    const s={tab:Array.from(d.slice(o,o+256)),bg:[],obj:[],recs:[]}; o+=256;
    for(const q of['bg','obj'])for(let k=0;k<8;k++){const pl=[];for(let c=0;c<4;c++){const v=d[o]|(d[o+1]<<8);pl.push([v&31,(v>>5)&31,(v>>10)&31]);o+=2}s[q].push(pl)}
    s.hud=d[o++];
    while(d[o]){const n=d[o],a=d[o+1]|(d[o+2]<<8);s.recs.push({addr:a,data:Array.from(d.slice(o+3,o+3+n))});o+=3+n}
    sc.push(s)}
  return sc}
function sceneBytes(s){ const b=[...s.tab];
  for(const q of['bg','obj'])for(const pl of s[q])for(const c of pl){const v=c[0]|(c[1]<<5)|(c[2]<<10);b.push(v&255,v>>8)}
  b.push(s.hud); for(const r of s.recs)b.push(r.data.length,r.addr&255,r.addr>>8,...r.data); b.push(0); return b}
function writeModel(sc,src){
  const d=new Uint8Array(src), pos=ZONES.map(z=>z[0]); ZONES.forEach(z=>d.fill(0xFF,z[0],z[1]));
  sc.forEach((s,i)=>{ const b=sceneBytes(s); let z=i<10?0:1;
    if(pos[z]+b.length>ZONES[z][1])z=1-z; if(pos[z]+b.length>ZONES[z][1])throw new Error('full');
    d.set(b,pos[z]); const a=0x4000+(pos[z]-BANK6); d[SCENE_TABLE+2*i]=a&255; d[SCENE_TABLE+2*i+1]=a>>8; pos[z]+=b.length });
  fixChecksum(d); return {rom:d,free:(ZONES[0][1]-pos[0])+(ZONES[1][1]-pos[1])}}
function rebuild(){ try{const r=writeModel(M,base); rom=r.rom; $('room').textContent=t('free')+r.free+t('bytes'); $('warn').textContent=''; return true}
  catch(e){ $('warn').textContent=t('full'); return false} }

// ---------------------------------------------------------------- reading the drawings and levels of the original game
function unpackSheet(v,sorte,i){
  let bq,ix; if(sorte==='a'){ if(i<0x14){bq=3;ix=i}else{bq=4;ix=i-0x14} } else {bq=5;ix=i}
  const o=bq*0x4000+ix*4; let dst=orig[o]|(orig[o+1]<<8), p=bq*0x4000+((orig[o+2]|(orig[o+3]<<8))-0x4000);
  for(;;){ let c=orig[p]; if(!c)break;
    for(let b=0;b<8;b++){ if(c&0x80)p++; c=(c<<1)&255; if(dst>=0x8000&&dst<0xA000)v[dst-0x8000]=orig[p]; dst++ }
    p++ } }
const cacheV={}, cacheN={};
function originalVideo(sc){ if(!cacheV[sc]){ const v=new Uint8Array(0x2000); v.fill(0x25,0x1800);
    const u=VIEWS[sc]; (u.a||[]).forEach(i=>unpackSheet(v,'a',i)); (u.b||[]).forEach(i=>unpackSheet(v,'b',i)); cacheV[sc]=v } return cacheV[sc] }
function patchedVideo(sc){ const v=new Uint8Array(originalVideo(sc)); for(const r of M[sc].recs) if(r.addr>=0x8000&&r.addr+r.data.length<=0xA000) v.set(r.data,r.addr-0x8000); return v }
function level(id){ if(!cacheN[id]){
    const o=7*0x4000+id*4, mb=7*0x4000+((orig[o]|(orig[o+1]<<8))-0x4000); let p=7*0x4000+((orig[o+2]|(orig[o+3]<<8))-0x4000);
    const ram=new Uint8Array(20*256);
    for(let pg=0;pg<20;pg++){ let e=0;
      for(let l=0;l<8;l++){ let c=orig[p++];
        for(let k=0;k<8;k++){ const a=orig[p]; if(c&0x80)p++; c=(c<<1)&255; const m=mb+a*4, b=pg*256;
          ram[b+e]=orig[m]; ram[b+(e|0x10)]=orig[m+1]; ram[b+((e+1)&255)]=orig[m+2]; ram[b+(((e+1)&255)|0x10)]=orig[m+3]; e=(e+0x20)&255 }
        e=(e+2)&255 } }
    cacheN[id]=ram } return cacheN[id] }
const tileAddr=n=>n<128?0x9000+n*16:0x8800+(n-128)*16;
function pixels(v,n){ const o=tileAddr(n)-0x8000, px=new Uint8Array(64);
  for(let y=0;y<8;y++){const lo=v[o+y*2],hi=v[o+y*2+1];for(let x=0;x<8;x++)px[y*8+x]=((lo>>(7-x))&1)|(((hi>>(7-x))&1)<<1)} return px }
function encode(px){ const b=[]; for(let y=0;y<8;y++){let lo=0,hi=0;for(let x=0;x<8;x++){const v=px[y*8+x];lo|=(v&1)<<(7-x);hi|=(v>>1)<<(7-x)}b.push(lo,hi)} return b }

function tilemap(sc){ const u=VIEWS[sc]; if(u.stagesel){ const ram=level(+$('stagesel').value), w=320, h=16, c=new Uint8Array(w*h);
    for(let x=0;x<w;x++)for(let y=0;y<h;y++)c[y*w+x]=ram[(x>>4)*256+(x&15)*16+y]; return {w,h,c} }
  const v=originalVideo(sc), c=new Uint8Array(20*18); for(let y=0;y<18;y++)for(let x=0;x<20;x++)c[y*20+x]=v[0x1800+y*32+x]; return {w:20,h:18,c} }

// ---------------------------------------------------------------- 1. the ROM
async function receive(file){
  const u=new Uint8Array(await file.arrayBuffer()), e=$('status'); e.dataset.frozen=1;
  const h=await sha1(u);
  if(h!==SHA_ORIG){ e.className='ko'; e.textContent=(u.length===SIZE&&u[0x143]===0x80)?t('already'):t('wrong'); return }
  orig=u; e.className='ok'; e.textContent=t('good');
  ['c2','c3','c4'].forEach(i=>$(i).hidden=false); await loadMood() }
$('f').onchange=e=>e.target.files[0]&&receive(e.target.files[0]);
const z=$('dropzone'); ['dragenter','dragover'].forEach(n=>z.addEventListener(n,e=>{e.preventDefault();z.classList.add('over')}));
['dragleave','drop'].forEach(n=>z.addEventListener(n,e=>{e.preventDefault();z.classList.remove('over')}));
z.addEventListener('drop',e=>e.dataTransfer.files[0]&&receive(e.dataTransfer.files[0]));

// ---------------------------------------------------------------- 2. the mood
async function loadMood(){
  const v=$('mood').value, f='patches/Batman-DX'+(v==='dx'?'':'-'+v)+'.ips';
  const ips=new Uint8Array(await (await fetch(f)).arrayBuffer());
  base=applyIPS(orig,ips); M=readModel(base); rom=new Uint8Array(base); picked=-1; renderPalettes(); await showSha(); await boot() }
$('mood').onchange=loadMood;
async function showSha(){ $('sha').textContent=t('checksum')+await sha1(rom) }
function download(u8,nom){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([u8],{type:'application/octet-stream'}));a.download=nom;document.body.appendChild(a);a.click();a.remove()}
const baseName=()=>'Batman-DX'+($('mood').value==='dx'?'':'-'+$('mood').value)+(same(rom,base)?'':'-custom');
$('dlrom').onclick=()=>{if(rebuild())download(rom,baseName()+'.gbc')};
$('dlips').onclick=()=>{if(rebuild())download(makeIPS(orig,rom),baseName()+'.ips')};

// ---------------------------------------------------------------- 3. the emulator
const W=WasmBoy.WasmBoy, st={UP:false,RIGHT:false,DOWN:false,LEFT:false,A:false,B:false,SELECT:false,START:false};
const pushPad=()=>W.setJoypadState(st);
document.querySelectorAll('.k').forEach(e=>{const k=e.dataset.k;
  const on=v=>ev=>{ev.preventDefault();st[k]=v;e.classList.toggle('on',v);pushPad()};
  e.addEventListener('touchstart',on(true),{passive:false});e.addEventListener('touchend',on(false),{passive:false});e.addEventListener('touchcancel',on(false),{passive:false});
  e.addEventListener('mousedown',on(true));e.addEventListener('mouseup',on(false));e.addEventListener('mouseleave',on(false))});
const KEYS={ArrowUp:'UP',ArrowDown:'DOWN',ArrowLeft:'LEFT',ArrowRight:'RIGHT',x:'A',X:'A',z:'B',Z:'B',w:'B',W:'B',Enter:'START',Shift:'SELECT'};
addEventListener('keydown',e=>{const k=KEYS[e.key];if(k&&rom&&e.target.tagName!=='INPUT'&&e.target.tagName!=='SELECT'){e.preventDefault();st[k]=true;pushPad()}});
addEventListener('keyup',e=>{const k=KEYS[e.key];if(k&&rom){st[k]=false;pushPad()}});
async function boot(){ if(!rom)return;
  try{ try{await W.pause()}catch(e){}
    await W.config({isGbcEnabled:true,isGbcColorizationEnabled:false,isAudioEnabled:false,frameSkip:0,audioBatchProcessing:true,graphicsBatchProcessing:false,timersBatchProcessing:false,audioAccumulateSamples:true,gameboyFrameRate:60},$('lcd'));
    W.disableDefaultJoypad(); await W.loadROM(new Uint8Array(rom)); await W.play() }catch(e){console.error(e)} }
$('restart').onclick=boot;

// ---------------------------------------------------------------- 4. the lab
let picked=-1, mask=new Uint8Array(64);
function renderPalettes(){ if(!M)return; const sc=+$('scene').value, q=$('what').value, box=$('pals'); box.innerHTML=''; const S=M[sc];
  for(let p=0;p<8;p++){ const d=document.createElement('div'); d.className='pal';
    d.innerHTML='<b>'+(q==='bg'?(p===S.hud?t('statusbar'):t('pal')+p):t('ob')[p])+'</b>';
    for(let k=(q==='obj'?1:0);k<4;k++){ const i=document.createElement('input'); i.type='color'; i.value=hex(S[q][p][k]);
      i.oninput=()=>{S[q][p][k]=unhex(i.value);draw()}; d.appendChild(i) }
    box.appendChild(d) }
  const u=VIEWS[sc]; $('view').hidden=!u;
  if(u){ const n=$('stagesel'), v=n.dataset.sc===String(sc)?n.value:null; n.innerHTML=''; n.dataset.sc=sc;
    (u.stagesel||[0]).forEach(id=>{const o=document.createElement('option');o.value=id;o.textContent=u.stagesel?t('level')+STAGENAME[id]:t('screen');n.appendChild(o)}); if(v)n.value=v; n.hidden=!u.stagesel;
    const ps=$('tilepal'); ps.innerHTML=''; for(let p=0;p<8;p++){const o=document.createElement('option');o.value=p;o.textContent=(p===S.hud?t('statusbar'):t('pal')+p);ps.appendChild(o)}
    draw() }
  $('toolbox').hidden=!(u&&picked>=0); if(u&&picked>=0)toolbox(); rebuild() }
function draw(){ const sc=+$('scene').value; if(!VIEWS[sc])return; const S=M[sc], k=tilemap(sc), v=patchedVideo(sc), Z=2, cv=$('preview');
  cv.width=k.w*8; cv.height=k.h*8; cv.style.width=(k.w*8*Z)+'px'; const cx=cv.getContext('2d'), im=cx.createImageData(k.w*8,k.h*8), pc={};
  for(let ty=0;ty<k.h;ty++)for(let tx=0;tx<k.w;tx++){ const n=k.c[ty*k.w+tx], px=pc[n]||(pc[n]=pixels(v,n));
    let p=S.tab[n]; if(!VIEWS[sc].stagesel&&false)p=S.hud; const pal=S.bg[p];
    for(let y=0;y<8;y++)for(let x=0;x<8;x++){ const c=pal[px[y*8+x]], o=((ty*8+y)*k.w*8+tx*8+x)*4; im.data[o]=c[0]*255/31; im.data[o+1]=c[1]*255/31; im.data[o+2]=c[2]*255/31; im.data[o+3]=255 } }
  cx.putImageData(im,0,0);
  if(picked>=0){ cx.strokeStyle='#ffd21a'; cx.lineWidth=1; for(let i=0;i<k.c.length;i++) if(k.c[i]===picked) cx.strokeRect((i%k.w)*8+.5,Math.floor(i/k.w)*8+.5,7,7) }
  if(picked>=0&&!$('toolbox').hidden)drawZooms() }
$('preview').onclick=e=>{ const sc=+$('scene').value, k=tilemap(sc), cv=$('preview'), r=cv.getBoundingClientRect();
  const tx=Math.floor((e.clientX-r.left)*cv.width/r.width/8), ty=Math.floor((e.clientY-r.top)*cv.height/r.height/8); if(tx<0||ty<0||tx>=k.w||ty>=k.h)return;
  picked=k.c[ty*k.w+tx]; maskFromRetouch(); $('toolbox').hidden=false; toolbox(); draw() };
function findRetouch(sc,n){ return M[sc].recs.find(r=>r.addr===tileAddr(n)&&r.data.length===16) }
function maskFromRetouch(){ const sc=+$('scene').value, o=pixels(originalVideo(sc),picked), r=findRetouch(sc,picked); mask=new Uint8Array(64);
  if(r){ const v=new Uint8Array(0x2000); v.set(r.data,tileAddr(picked)-0x8000); const px=pixels(v,picked); for(let i=0;i<64;i++)mask[i]=(px[i]===0&&o[i]===0)?1:0 } }
function toolbox(){ const sc=+$('scene').value; $('tiletitle').textContent=t('tile')+picked.toString(16).toUpperCase().padStart(2,'0')+(findRetouch(sc,picked)?t('retouched'):'');
  $('tilepal').value=M[sc].tab[picked]; drawZooms() }
function drawZooms(){ const sc=+$('scene').value, S=M[sc], o=pixels(originalVideo(sc),picked), G=[[255,255,255],[170,170,170],[85,85,85],[0,0,0]], map=INSIDE[+$('inside').value];
  const a=$('zoom').getContext('2d'), b=$('result').getContext('2d'), pal=S.bg[S.tab[picked]], fait=pixels(patchedVideo(sc),picked);
  for(let i=0;i<64;i++){ const x=(i&7)*24,y=(i>>3)*24, g=G[o[i]]; a.fillStyle='rgb('+g+')'; a.fillRect(x,y,24,24);
    if(mask[i]){a.strokeStyle='#ffd21a';a.lineWidth=3;a.strokeRect(x+2.5,y+2.5,19,19)}
    const c=pal[fait[i]]; b.fillStyle=hex(c); b.fillRect(x,y,24,24) } }
$('zoom').onclick=e=>{ const r=$('zoom').getBoundingClientRect(), x=Math.floor((e.clientX-r.left)/r.width*8), y=Math.floor((e.clientY-r.top)/r.height*8), i=y*8+x;
  const o=pixels(originalVideo(+$('scene').value),picked); if(o[i]===0){mask[i]^=1;drawZooms()} };
$('detect').onclick=()=>{ const o=pixels(originalVideo(+$('scene').value),picked); mask=new Uint8Array(64); const pile=[];
  for(let i=0;i<64;i++){const x=i&7,y=i>>3;if((x===0||x===7||y===0||y===7)&&o[i]===0)pile.push(i)}
  while(pile.length){const i=pile.pop(); if(mask[i]||o[i]!==0)continue; mask[i]=1; const x=i&7,y=i>>3; if(x>0)pile.push(i-1); if(x<7)pile.push(i+1); if(y>0)pile.push(i-8); if(y<7)pile.push(i+8)}
  drawZooms() };
$('apply').onclick=()=>{ const sc=+$('scene').value, o=pixels(originalVideo(sc),picked), map=INSIDE[+$('inside').value], px=new Uint8Array(64);
  for(let i=0;i<64;i++)px[i]=mask[i]?0:map[o[i]];
  const anc=findRetouch(sc,picked), sauv=anc?anc.data:null, data=encode(px);
  if(anc)anc.data=data; else M[sc].recs.push({addr:tileAddr(picked),data});
  if(!rebuild()){ if(anc)anc.data=sauv; else M[sc].recs.pop(); rebuild(); $('warn').textContent=t('full') }
  toolbox(); draw() };
$('remove').onclick=()=>{ const sc=+$('scene').value, r=findRetouch(sc,picked); if(r)M[sc].recs.splice(M[sc].recs.indexOf(r),1); mask=new Uint8Array(64); rebuild(); toolbox(); draw() };
$('tilepal').onchange=()=>{ M[+$('scene').value].tab[picked]=+$('tilepal').value; rebuild(); draw() };
$('bgpal').onclick=()=>{ const S=M[+$('scene').value]; S.bg[S.tab[picked]][0]=[...S.bg[0][0]]; renderPalettes() };
$('inside').onchange=drawZooms; $('stagesel').onchange=()=>{draw()};
$('scene').onchange=()=>{picked=-1;renderPalettes()}; $('what').onchange=renderPalettes;
$('tryit').onclick=async()=>{ if(rebuild()){await showSha();await boot()} };
$('reset').onclick=async()=>{ M=readModel(base); picked=-1; renderPalettes(); await showSha(); await boot() };
$('exportbtn').onclick=()=>{ const o={format:'batman-dx-settings-2',scenes:M.map(s=>({bg:s.bg,obj:s.obj,tab:s.tab,retouches:s.recs.map(r=>[r.addr,r.data])}))};
  download(new TextEncoder().encode(JSON.stringify(o)),'my-batman-dx-settings.json') };
$('importfile').onchange=async e=>{ const f=e.target.files[0]; if(!f)return; const sauve=JSON.stringify(M);
  try{ const o=JSON.parse(await f.text()); if(!o.scenes||o.scenes.length!==NB_SCENES)throw 0; const born=v=>Math.max(0,Math.min(31,v|0));
    o.scenes.forEach((sc,s)=>{ for(const q of['bg','obj'])for(let p=0;p<8;p++)for(let k=0;k<4;k++)M[s][q][p][k]=sc[q][p][k].map(born);
      if(sc.tab&&sc.tab.length===256)M[s].tab=sc.tab.map(v=>v&7);
      if(sc.retouches)M[s].recs=sc.retouches.filter(r=>r[1].length>0&&r[1].length<256&&r[0]>=0x8000&&r[0]+r[1].length<=0xA000).map(r=>({addr:r[0]|0,data:r[1].map(v=>v&255)})) });
    if(!rebuild())throw 1; picked=-1; renderPalettes(); await showSha(); await boot() }
  catch(err){ M=JSON.parse(sauve); rebuild(); $('warn').textContent='JSON ?' } e.target.value='' };
applyTexts();
</script>
</body>

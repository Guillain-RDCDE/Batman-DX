# Copy to .github/workflows/check.yml to run the repository checks on every push.
name: Check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patches, colors, links, code
        run: python tools/check_repo.py
